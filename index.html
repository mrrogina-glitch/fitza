let scale=1;

 const cats=['Sve','Doručak','Ručak','Večera','Međuobrok'];

  ${meals.map(m=>`<div class="sub" style="padding:6px 0;border-top:1px solid var(--line)" onclick="tab='food';openRec='${m[1].id}';scale=1;render()"><span class="mut">${m[0]}</span><br><b style="font-size:14px">${m[1].n}</b> <span class="mut">· ${m[1].kcal} kcal</span></div>`).join('')}

 ${rows}</div>`;
}

function sugg(key,e){
 const h=S.sets[key]||[];if(!h.length)return 'Upiši prvu seriju – aplikacija će ti predložiti sljedeći korak.';
 const l=h[h.length-1],m=/×\s*(\d+)/.exec(e),tr=m?+m[1]:10;
 const last=`Zadnje: ${l.st||'?'}×${l.rp}${l.kg?' × '+l.kg+' kg':''} (${l.d}). `;
 if(l.rp>=tr)return last+(l.kg>0?`Spremna si za više – probaj ${l.kg+2} kg (+2 kg).`:'Cilj ostvaren – dodaj 2–3 ponavljanja ili težu varijantu.');

}

 const f=S.plan.f,p=S.plan.p,tr=FREQ[f][1],pool=planPool(p);let wi=0;
 return DAYS.map((dn,i)=>{const t=tr.includes(i);let w=null;if(t){w=pool[wi%pool.length];wi++}
  return {dn,t,w,meals:[['🌅 Doručak',mk('Doručak',i)],['☀️ Ručak',mk('Ručak',i)],['🍎 Međuobrok',t&&dietMode()==='Klasičan'?RECIPES.find(r=>r.id==='r7'):mk('Međuobrok',i+1)],['🌙 Večera',mk('Večera',i)]]}});
}

let prange=30;
function ser(key,n){const o=[];for(let i=n-1;i>=0;i--){const d=S.days[d0(i)];o.push(d&&d[key]!=null?d[key]:null)}return o}
function ma(a,k){return a.map((_,i)=>{const w=a.slice(Math.max(0,i-k+1),i+1).filter(x=>x!=null);return w.length?avg(w):null})}
function chart(v,col,unit,ref){
 const pts=v.map((y,i)=>y==null?null:[i,y]).filter(Boolean);
 if(pts.length<2)return '<p class="mut">Nema dovoljno podataka.</p>';
 const ys=pts.map(p=>p[1]),mn=Math.min(...ys),mx=Math.max(...ys),lo0=ref!=null?Math.min(mn,ref):mn,hi0=ref!=null?Math.max(mx,ref):mx,pad=(hi0-lo0)*.15||1,lo=lo0-pad,hi=hi0+pad,W=320,H=110,n=v.length-1||1;
 const X=i=>8+i/n*(W-16),Y=y=>H-8-(y-lo)/(hi-lo)*(H-16);
 const line=pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');
 const l=pts[pts.length-1];
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="graf">${ref!=null?`<line x1="8" x2="${W-8}" y1="${Y(ref).toFixed(1)}" y2="${Y(ref).toFixed(1)}" stroke="#2f9e77" stroke-dasharray="5 4" stroke-width="1.5"/>`:''}<polygon points="${X(pts[0][0]).toFixed(1)},${H-8} ${line} ${X(l[0]).toFixed(1)},${H-8}" fill="${col}" opacity=".13"/><polyline points="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(l[0]).toFixed(1)}" cy="${Y(l[1]).toFixed(1)}" r="4" fill="${col}"/></svg><div class="row mut" style="font-size:12px"><span>min ${f1(mn)} ${unit}</span><span style="text-align:center">sada ${f1(l[1])} ${unit}</span><span style="text-align:right">max ${f1(mx)} ${unit}</span></div>`;
}
function wk(off){const o={steps:0,st:[],tr:0,wa:[],sl:[],mo:[]};for(let i=off;i<off+7;i++){const d=S.days[d0(i)];if(!d)continue;o.steps+=d.steps||0;if(d.stress!=null)o.st.push(d.stress);o.tr+=(d.log||[]).length;if(d.water!=null)o.wa.push(d.water);if(d.sleep!=null)o.sl.push(d.sleep);if(d.mood!=null)o.mo.push(d.mood)}return o}
function pct(a,b){return b?Math.round((a-b)/b*100):0}
function arrow(p,inv){return `<span style="color:${(p>0)!==!!inv?'#2f9e77':'#c92a2a'}">${p>0?'▲':p<0?'▼':'•'} ${Math.abs(p)}%</span>`}

function insight(){
 const ks=Object.keys(S.days).filter(k=>S.days[k].stress!=null),rel=k=>(S.days[k].log||[]).some(l=>l.id==='h3'||l.id==='relax'),tr=k=>(S.days[k].log||[]).length>0;
 const A=ks.filter(rel).map(k=>S.days[k].stress),B=ks.filter(k=>!rel(k)).map(k=>S.days[k].stress),C=ks.filter(k=>tr(k)).map(k=>S.days[k].stress),E=ks.filter(k=>!tr(k)).map(k=>S.days[k].stress);
 let h='';
 if(A.length>=3&&B.length>=3)h+=`<p>🧘 Na dane s jogom ili opuštanjem tvoj je prosječni stres <b>${Math.round(avg(A))}</b>, a bez njih <b>${Math.round(avg(B))}</b> (${Math.round(avg(A))<Math.round(avg(B))?'−':'+'}${Math.abs(pct(avg(A),avg(B)))}%).</p>`;
 if(C.length>=3&&E.length>=3)h+=`<p style="margin-top:6px">💪 Na dane treninga: <b>${Math.round(avg(C))}</b>, na dane bez treninga: <b>${Math.round(avg(E))}</b>.</p>`;

}

let rs=null,rtI=null;
function startRelax(kind,sec){clearInterval(rtI);rs={kind,t:0,total:sec};rtI=setInterval(tickRelax,1000);render()}
function stopRelax(done){clearInterval(rtI);if(done&&rs){S.relax=(S.relax||0)+1;D().log.push({id:'relax',n:{b478:'Disanje 4-7-8',box:'Kutijasto disanje',med:'Meditacija'}[rs.kind],t:fmt(rs.total)});save();rs=null;notify('Sesija završena 🌿');return}rs=null;render()}
function tickRelax(){if(!rs||tab!=='relax'){clearInterval(rtI);rs=null;return}rs.t++;if(rs.t>=rs.total){stopRelax(true);return}updRelax()}
function updRelax(){
 if(!rs)return;const c=$('#rcir'),tx=$('#rtxt'),tm=$('#rtime');if(!c||!tx||!tm)return;
 tm.textContent=fmt(rs.total-rs.t);
 if(rs.kind==='med'){tx.textContent=MED[Math.floor(rs.t/30)%MED.length];return}
 const ph=rs.kind==='b478'?[['Udahni',4,1.5],['Zadrži',7,0],['Izdahni',8,1]]:[['Udahni',4,1.5],['Zadrži',4,0],['Izdahni',4,1],['Zadrži',4,0]];
 const cyc=ph.reduce((a,p)=>a+p[1],0),t=rs.t%cyc;let acc=0;
 for(const p of ph){if(t<acc+p[1]){if(t===acc){c.style.transition='transform '+p[1]+'s linear';if(p[2])c.style.transform='scale('+p[2]+')'}tx.textContent=T(p[0])+' '+(acc+p[1]-t);return}acc+=p[1]}
}

 <div class="card"><h3>🧘 Meditacija</h3><p class="mut" style="margin:4px 0 10px">Kratka vođena sesija s uputama svakih 30 s.</p><div class="row"><button class="btn sm" onclick="startRelax('med',180)">3 min</button><button class="btn sm" onclick="startRelax('med',300)">5 min</button></div></div>

 <div class="card"><h3>🤸 Istezanje (8 min)</h3>${L('s',STR)}<p class="mut" style="font-size:12px;margin-top:6px">Istezanje drži mirno, bez poskakivanja i bez boli.</p></div></div>`;

const EXACT={};PAIRS.forEach(p=>{EXACT[p[0].trim()]=p[1].trim()});
const PHR=PAIRS.filter(p=>p[0].length>=5).sort((a,b)=>b[0].length-a[0].length);
PHR.unshift(['Bok, ','Hi, ']);
function T(s){
 if(ST.lang==='hr'||!s)return s;
 const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(s),core=m[2];
 let en=EXACT[core]!=null?EXACT[core]:null,r=s;
 if(en==null){for(const p of PHR){if(r.indexOf(p[0])>=0)r=r.split(p[0]).join(p[1])}en=r.trim()}
 if(ST.lang!=='en'){const d=typeof EUX!=='undefined'&&EUX[ST.lang];if(d&&d[en]!=null)return m[1]+d[en]+m[3]}
 return EXACT[core]!=null?m[1]+EXACT[core]+m[3]:r;
}
function xl(root){
 if(ST.lang==='hr'||!root||typeof document.createTreeWalker!=='function')return;
 const w=document.createTreeWalker(root,4),arr=[];let n;while((n=w.nextNode()))arr.push(n);
 arr.forEach(x=>{const v=x.nodeValue;if(v&&v.trim()){const r=T(v);if(r!==v)x.nodeValue=r}});
 root.querySelectorAll('[placeholder]').forEach(e=>{e.placeholder=T(e.placeholder)});
}

function wcard(ms){
 const first=S.meas.length?S.meas[0].w:S.w,cur=S.w,g=S.goalW,diff=+(cur-first).toFixed(1),h=S.h/100,bm=(cur/(h*h)).toFixed(1);

 return `<div class="card"><h3>⚖️ ${L('Težina i cilj','Weight and goal')}</h3>

 ${chart(ms.map(m=>m.w),'#d6336c','kg',g)}${g?`<p class="mut" style="font-size:12px">${L('Isprekidana crta = cilj','Dashed line = goal')}</p>`:''}${prog}
 <div class="row" style="margin-top:10px"><div><label>${L('Ciljna težina (kg)','Goal weight (kg)')}</label><input id="gw" type="number" step="0.1" value="${g||''}"></div><div style="align-self:end"><button class="btn sm" style="width:100%" onclick="setGoalW()">${L('Spremi cilj','Save goal')}</button></div></div>
 <details style="margin-top:10px"><summary style="cursor:pointer"><b>${L('Povijest mjerenja','Measurement history')}</b></summary>${S.meas.slice(-8).reverse().map(m=>`<div class="flex" style="padding:6px 0;border-top:1px solid var(--line)"><span style="flex:1">${m.d}</span><b>${m.w} kg</b><span class="mut">${m.waist?m.waist+' cm':''}</span><span class="mut" style="cursor:pointer" onclick="delMeas('${m.d}')" aria-label="delete">✕</span></div>`).join('')}</details>
 <p class="mut" style="font-size:12px;margin-top:8px">${L('KMI je okvirni pokazatelj i ne uzima u obzir mišićnu masu. Ciljnu težinu dogovori s liječnikom ili nutricionistom.','BMI is a rough indicator and ignores muscle mass. Agree on a goal weight with your doctor or nutritionist.')}</p></div>`;
}

document.head.insertAdjacentHTML('beforeend','<style>@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes fall{from{transform:translateY(-20px) rotate(0);opacity:1}to{transform:translateY(105vh) rotate(540deg);opacity:0}}#app.fade>.pad,#app.fade>.hero{animation:fu .3s ease}.card,.chip,.btn,.stat{transition:transform .12s,box-shadow .2s}.card.sub:active,.chip:active,.btn:active,.stat.sub:active{transform:scale(.97)}.wcard{border-left:5px solid #d6336c}.wcard h3{display:flex;gap:8px;align-items:center}.conf{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}.conf span{position:absolute;top:-20px;font-size:26px;animation:fall 2.2s ease-in forwards}.big{font-size:56px;font-weight:800;text-align:center;color:var(--p);margin:6px 0}.pbar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#ff6b9a,#7048e8);transition:width .4s}.wk{display:flex;justify-content:space-between;margin-top:10px}.wk div{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--line);color:var(--mut)}.wk div.ok{background:#2f9e77;color:#fff}.wk div.today{outline:2px solid #d6336c}body.rm .conf{display:none}body.rm *{animation:none!important}</style>');

// ---------- pomoćno ----------
let _ac=null;function beep(){try{const A=window.AudioContext||window.webkitAudioContext;if(A){if(!_ac)_ac=new A();if(_ac.state==='suspended'&&_ac.resume)_ac.resume();const c=_ac,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(c.currentTime+.16)}}catch(e){}try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}}
function celebrate(){try{if(!document.body||!document.body.insertAdjacentHTML||rmOn())return;const em=['🎉','✨','💪','🌸','⭐','🏆'];document.body.insertAdjacentHTML('beforeend','<div class="conf" id="conf">'+Array.from({length:26},(_,i)=>`<span style="left:${Math.random()*100}%;animation-delay:${(Math.random()*.8).toFixed(2)}s">${em[i%em.length]}</span>`).join('')+'</div>');setTimeout(()=>{const c=$('#conf');if(c&&c.remove)c.remove()},3200)}catch(e){}}
const WI={h1:'🤸',h2:'🔥',h3:'🧘',g1:'🍑',g2:'💪',g3:'⚡',o1:'🚶',o2:'🏃',o3:'🌳'};
function wIcon(w){return WI[w.id]||'💪'}

function wfBar(){return `<div class="chips">${[['all',L('Sve trajanje','Any length')],['s',L('do 20 min','up to 20 min')],['m','21–30 min'],['l','30+ min']].map(x=>`<div class="chip ${wf===x[0]?'on':''}" onclick="wf='${x[0]}';render()">${x[1]}</div>`).join('')}</div>`}
function todayIdx(){return (new Date().getDay()+6)%7}
function todayCard(){

 if(!d.t)return `<div class="card" style="background:var(--p2)"><h3>😴 ${L('Danas je dan odmora','Today is a rest day')}</h3><p class="mut">${L('Lagani hod 20–30 min i 10 min istezanja. Odmor je dio napretka.','A light 20–30 min walk and 10 min of stretching. Rest is part of progress.')}</p></div>`;
 return `<div class="card sub" style="background:linear-gradient(135deg,#ff6b9a,#9c36b5);color:#fff" onclick="loc='${S.plan.p}';openWo='${d.w.id}';tab='train';tsub='wo';render()"><span style="opacity:.85;font-size:12px">${L('DANAS PO PLANU','TODAY\'S PLAN')}</span><h3 style="margin-top:2px">${wIcon(d.w)} ${d.w.n}</h3><span style="opacity:.9;font-size:13px">${d.w.min} min · ~${d.w.kcal} kcal ▸</span></div>`;
}

// ---------- vođeni trening ----------
function parseEx(e){
 let m=/(\d+)\s*s\s*sprint.*?(\d+)\s*s.*?×\s*(\d+)/.exec(e);if(m)return {sets:+m[3],val:+m[1],time:true,rest:+m[2]};
 m=/(\d+)\s*min\s*trk.*?(\d+)\s*min.*?×\s*(\d+)/.exec(e);if(m)return {sets:+m[3],val:+m[1]*60,time:true,rest:+m[2]*60};
 m=/(\d+)×(\d+)(?:\s*(s|min))?/.exec(e);if(m){const u=m[3];return {sets:+m[1],val:u==='min'?+m[2]*60:+m[2],time:!!u,rest:30}}
 m=/(\d+)\s*min/.exec(e);if(m)return {sets:1,val:+m[1]*60,time:true,rest:30};
 return {sets:1,val:40,time:true,rest:30};
}
const exBase=e=>e.replace(/\s*\d.*$/,'').trim()||e;
function startPlayer(id){
 const w=find(id);clearInterval(plI);
 pl={id,i:0,set:1,ph:'ready',left:5,paused:false,t0:Date.now(),ex:w.ex.map(e=>Object.assign({e},parseEx(e)))};
 plI=setInterval(plTick,1000);render();scrollTo(0,0);
}
const plCur=()=>pl.ex[pl.i];
function startWork(){const x=plCur();pl.ph='work';pl.left=x.time?x.val:null;beep();render()}
function plDone(){
 const x=plCur();
 if(pl.set<x.sets){pl.nextSet=true;pl.ph='rest';pl.left=x.rest||30}
 else if(pl.i<pl.ex.length-1){pl.nextEx=true;pl.ph='rest';pl.left=30}
 else{pl.ph='fin';clearInterval(plI);celebrate()}
 beep();render();
}
function plRestEnd(){if(pl.nextSet){pl.set++;pl.nextSet=false}else if(pl.nextEx){pl.i++;pl.set=1;pl.nextEx=false}startWork()}
function plTick(){
 if(!pl||pl.paused||pl.ph==='fin')return;
 if(tab!=='train'){pl.paused=true;return}
 if(pl.ph==='work'&&!plCur().time)return;
 pl.left--;
 if(pl.left<=0){if(pl.ph==='ready')startWork();else if(pl.ph==='work')plDone();else if(pl.ph==='rest')plRestEnd();return}
 const t=$('#plt');if(t)t.textContent=fmt(pl.left);
}
function plPause(){pl.paused=!pl.paused;render()}
function plSkip(){if(pl.ph==='ready')startWork();else if(pl.ph==='work')plDone();else if(pl.ph==='rest')plRestEnd()}
function plExit(){clearInterval(plI);pl=null;render()}
function plSave(){const id=pl.id;tSec=Math.round((Date.now()-pl.t0)/1000);clearInterval(plI);pl=null;finish(id);celebrate()}
function playerView(){
 const x=plCur(),tot=pl.ex.length,pct=Math.round(((pl.i+(pl.ph==='fin'?1:(pl.set-1)/x.sets))/tot)*100),name=exBase(x.e);
 const head=`<div class="flex" style="justify-content:space-between"><button class="btn sec sm" onclick="plExit()">✕ ${L('Izlaz','Exit')}</button><span class="mut">${L('Vježba','Exercise')} ${pl.i+1}/${tot}</span></div><div class="pbar" style="margin:10px 0 14px"><i style="width:${pct}%"></i></div>`;
 if(pl.ph==='fin')return `<div class="pad">${head}<div style="text-align:center;padding:30px 0"><div style="font-size:64px">🏆</div><h2>${L('Bravo! Trening je gotov','Great job! Workout complete')}</h2><p class="mut" style="margin:8px 0 20px">${L('Ukupno vrijeme','Total time')}: ${fmt(Math.round((Date.now()-pl.t0)/1000))}</p><button class="btn" onclick="plSave()">💾 ${L('Spremi trening','Save workout')}</button></div></div>`;
 if(pl.ph==='ready')return `<div class="pad">${head}<p class="mut" style="text-align:center">${L('Pripremi se','Get ready')}</p><h2 style="text-align:center">${name}</h2>${anim(animType(x.e))}<div class="big" id="plt">${fmt(pl.left)}</div><button class="btn sec" onclick="plSkip()">${L('Kreni odmah','Start now')}</button></div>`;
 if(pl.ph==='rest'){const nx=pl.nextEx?plCur&&pl.ex[pl.i+1]:x;return `<div class="pad">${head}<h2 style="text-align:center">😮‍💨 ${L('Odmor','Rest')}</h2><div class="big" id="plt">${fmt(pl.left)}</div><div class="card" style="text-align:center"><span class="mut">${L('Sljedeće','Up next')}</span><br><b>${nx?exBase(nx.e):''}</b><br><span class="mut">${pl.nextEx?'':L('serija','set')+' '+(pl.set+1)+'/'+x.sets}</span></div><div class="row"><button class="btn sec" onclick="plPause()">${pl.paused?'▶':'⏸'} ${pl.paused?L('Nastavi','Resume'):L('Pauza','Pause')}</button><button class="btn" onclick="plSkip()">${L('Preskoči odmor','Skip rest')}</button></div></div>`}
 return `<div class="pad">${head}<h2 style="text-align:center">${name}</h2><p class="mut" style="text-align:center">${L('Serija','Set')} ${pl.set}/${x.sets}</p>${anim(animType(x.e))}
 ${x.time?`<div class="big" id="plt">${fmt(pl.left)}</div>`:`<div class="big">${x.val}×</div><p class="mut" style="text-align:center">${L('ponavljanja – kad završiš, dodirni Gotovo','reps – tap Done when finished')}</p>`}
 <p style="font-size:14px;margin:8px 0;color:var(--ink)">${tech(x.e)}</p>
 <div class="row"><button class="btn sec" onclick="plPause()">${pl.paused?'▶':'⏸'} ${pl.paused?L('Nastavi','Resume'):L('Pauza','Pause')}</button><button class="btn" onclick="plSkip()">✔ ${L('Gotovo','Done')}</button></div></div>`;
}

function ring(p,col,ico,val,lab){const r=26,c=2*Math.PI*r;return `<div style="text-align:center"><svg viewBox="0 0 64 64" width="78" height="78" role="img" aria-label="${lab} ${p}%"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(c*Math.min(100,p)/100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 32 32)"/><text x="32" y="38" text-anchor="middle" font-size="18">${ico}</text></svg><div style="font-weight:700;font-size:15px">${val}</div><div class="mut" style="font-size:11px">${lab}</div></div>`}
function weekDots(){
 const names=L(['P','U','S','Č','P','S','N'],['M','T','W','T','F','S','S']),ti=todayIdx();let n=0;
 const dots=names.map((nm,i)=>{const d=S.days[d0(ti-i)],ok=i<=ti&&d&&(d.log||[]).some(l=>l.id!=='relax');if(ok)n++;return `<div class="${ok?'ok':''} ${i===ti?'today':''}">${ok?'✓':nm}</div>`}).join('');
 return {n,html:`<div class="wk">${dots}</div>`};
}
function streak(){let s=0;for(let i=0;i<120;i++){const d=S.days[d0(i)],a=d&&((d.log&&d.log.length)||d.steps>=5000);if(a)s++;else if(i>0)break;else continue}return s}
function cycGoal(){S.weekGoal=({2:3,3:4,4:5,5:2})[S.weekGoal||3]||3;save();render()}
function home(){
 const d=D(),g=goalSteps(),gw=Math.ceil(waterGoal()/0.2),wk7=weekDots(),wg=S.weekGoal||3,h=new Date().getHours();
 const hello=h<5?L('Laku noć','Good night'):h<11?L('Dobro jutro','Good morning'):h<18?L('Dobar dan','Good afternoon'):L('Dobra večer','Good evening');
 const st=d.stress,stTxt=st==null?'—':st<35?L('Nizak 😌','Low 😌'):st<60?L('Umjeren 🙂','Moderate 🙂'):L('Visok 😟','High 😟');
 const hist=Object.keys(S.days).sort().slice(-7),mx=Math.max(...hist.map(k=>S.days[k].steps),1),rec=RECIPES.filter(avail),rr=rec[new Date().getDate()%rec.length],sk=streak();
 return `<div class="hero"><div class="avatar">🌸</div><p style="margin:0">${hello},</p><h1>${S.name}!</h1><p>${MOTIV[new Date().getDate()%MOTIV.length]}</p></div>
 <div class="pad">

}

function actDay(k){const d=S.days&&S.days[k];return !!(d&&((d.log&&d.log.length)||d.steps>=5000))||!!(S.mini&&S.mini[k])}
function streak(){let s=0;for(let i=0;i<400;i++){if(actDay(d0(i)))s++;else if(i>0)break}return s}
function bestStreak(){let b=0,c=0;for(let i=400;i>=0;i--){if(actDay(d0(i))){c++;if(c>b)b=c}else c=0}return b}

 const strip=[];for(let i=13;i>=0;i--){const k=d0(i),on=actDay(k),t=i===0;strip.push(`<div class="${on?'ok':''} ${t?'today':''}" title="${k}" style="width:20px;height:20px;font-size:10px">${on?'✓':''}</div>`)}

/* ===================== DIO 8: ANIMACIJE S KOSTURNIM MODELOM (FK/IK, stalne duljine udova) ===================== */
const SG={tor:26,ua:15,fa:14,th:21,sh:20,hd:11};
const _d=a=>{const r=a*Math.PI/180;return [Math.sin(r),Math.cos(r)]};
const _pt=(p,l,a)=>{const d=_d(a);return [p[0]+l*d[0],p[1]+l*d[1]]};
const PD={T:180,u:0,f:0,t1:0,s1:0,t2:0,s2:0,air:0,g:0,x:55,ax:60,h:null,hx:null,hy:0};
function _ik(S,H,l1,l2){
 let dx=H[0]-S[0],dy=H[1]-S[1],d=Math.hypot(dx,dy);d=Math.min(d,l1+l2-.01);
 const a=Math.atan2(dx,dy)*180/Math.PI,al=Math.acos(Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d))))*180/Math.PI;
 const c=[a-al,a+al].map(u=>{const E=_pt(S,l1,u);return {u,E}}).sort((p,q)=>p.E[0]-q.E[0])[0];
 const f=Math.atan2(H[0]-c.E[0],H[1]-c.E[1])*180/Math.PI;return {u:c.u,f};
}
function skel(p,anc){
 const hip=[0,0],sh=_pt(hip,SG.tor,p.T),head=_pt(sh,SG.hd,p.h==null?p.T:p.h);
 const k1=_pt(hip,SG.th,p.t1),a1=_pt(k1,SG.sh,p.s1),k2=_pt(hip,SG.th,p.t2),a2=_pt(k2,SG.sh,p.s2);
 let maxY=Math.max(k1[1],a1[1],k2[1],a2[1]);
 let u=p.u,f=p.f,el,ha;
 if(p.hx!=null){ // ruke se postavljaju IK-om na zadanu točku (npr. sklek)
  let sx,dy=93-p.g-p.air-maxY; // pomak y
  const S=[sh[0],sh[1]+dy];
  const H=[p.hx-(anc==='hip'?p.x:0),93-p.hy];
  // pomak x: kuk na p.x
  const S2=[S[0]+p.x,S[1]],ik=_ik(S2,[p.hx,H[1]],SG.ua,SG.fa);u=ik.u;f=ik.f;
 }
 el=_pt(sh,SG.ua,u);ha=_pt(el,SG.fa,f);
 const P=[head,sh,hip,el,ha,k1,a1,k2,a2];
 if(p.hx==null)maxY=Math.max(...P.map(q=>q[1]));
 const dy=93-p.g-p.air-maxY;
 let dx=anc==='foot'?p.ax-a1[0]:p.x;
 return P.map(q=>[q[0]+dx,q[1]+dy]);
}

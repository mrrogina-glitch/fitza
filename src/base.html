};
function tech(e){const k=Object.keys(TECH).sort((a,b)=>b.length-a.length).find(x=>e.startsWith(x));return k?TECH[k]:''}
const WB={h1:[1,6],h2:[2],h3:[3,6],g1:[0,1],g2:[3,4,5],g3:[1,6],o1:[1,6],o2:[1,6],o3:[1,5,0]};
function goTips(i){tipCat=Object.keys(TIPS)[i];tsub='tips';openWo=null;clearInterval(tInt);tSec=0;render()}
let tsub='wo',tipCat='🍑 Guzice';
const MOTIV=['Svaki korak se računa 💪','Danas si jača nego jučer.','Disanje je i trening – udahni duboko.','Napredak, ne savršenstvo.'];

// ---------- pomoćno ----------
const $=s=>document.querySelector(s);
const today=()=>new Date().toISOString().slice(0,10);
function rnd(a,b){return Math.round(a+Math.random()*(b-a))}
function day(){if(!S.days)S.days={};if(!S.days[today()])S.days[today()]={steps:0,stress:null,log:[],kcal:0};return S.days[today()]}
function bmi(){const h=S.h/100;return (S.w/(h*h)).toFixed(1)}
function goalSteps(){return S.goal==='Gubitak kilograma'?10000:S.goal==='Opuštanje / stres'?7000:8000}
function notify(m){toast=typeof T==='function'?T(m):m;render();setTimeout(()=>{toast='';render()},1800)}
function waterGoal(){return Math.round(S.w*0.033*10)/10}

// ---------- ekrani ----------
function auth(){
 if(typeof socialScreen==='function'&&socP)return socialScreen();
 return `<div class="hero"><div class="logo"><svg viewBox="0 0 64 64"><g fill="#ff6b9a"><ellipse cx="32" cy="16" rx="8" ry="13"/><ellipse cx="32" cy="16" rx="8" ry="13" transform="rotate(72 32 32)"/><ellipse cx="32" cy="16" rx="8" ry="13" transform="rotate(144 32 32)"/><ellipse cx="32" cy="16" rx="8" ry="13" transform="rotate(216 32 32)"/><ellipse cx="32" cy="16" rx="8" ry="13" transform="rotate(288 32 32)"/></g><circle cx="32" cy="32" r="8" fill="#7048e8"/></svg><h1>Fitža</h1></div><p style="margin-top:12px">Vježbaj kod kuće, u teretani ili u prirodi. Jedi pametno. Prati napredak.</p></div>
 <div class="pad"><button class="btn" onclick="skip()">✨ Isprobaj odmah – preskoči registraciju</button>${typeof socialBtns==='function'?socialBtns():''}
 <p class="mut" style="text-align:center;margin:12px 0 4px">ili se registriraj</p><h2>Registracija</h2>
 <label>Ime</label><input id="ime" placeholder="npr. Ana">
 <label>E-mail</label><input id="mail" type="email" placeholder="ana@primjer.hr">
 <label>Lozinka</label><input id="pass" type="password" placeholder="min. 6 znakova">
 <div class="row"><div><label>Dob</label><input id="dob" type="number" value="30"></div><div><label>Visina (cm)</label><input id="vis" type="number" value="168"></div><div><label>Težina (kg)</label><input id="tez" type="number" value="65"></div></div>
 <label>Cilj</label><select id="cilj"><option value="Gubitak kilograma">Gubitak kilograma</option><option value="Jačanje i tonus">Jačanje i tonus</option><option value="Opuštanje / stres">Opuštanje / stres</option><option value="Kondicija">Kondicija</option></select>
 <label>Razina aktivnosti</label><select id="lvl"><option value="Početnica">Početnica</option><option value="Srednja">Srednja</option><option value="Napredna">Napredna</option></select>
 <label>Kod pozivnice (neobavezno)</label><input id="ref" placeholder="npr. ANA-1234">
 <label>Gdje najradije vježbaš?</label><select id="gdje"><option value="Kod kuće">Kod kuće</option><option value="U teretani">U teretani</option><option value="Na otvorenom">Na otvorenom</option></select>
 <p class="mut" id="err" style="margin:10px 0;color:#c92a2a"></p>
 <button class="btn" onclick="register()">Kreiraj račun</button>
 <p class="mut" style="margin-top:12px;text-align:center">Demo: podaci se spremaju samo u tvom pregledniku.</p></div>`;
}
function register(){
 const v=id=>$('#'+id).value.trim();
 if(!v('ime')||!/\S+@\S+\.\S+/.test(v('mail'))){$('#err').textContent='Upiši ime i ispravan e-mail.';return}
 if(v('pass').length<6){$('#err').textContent='Lozinka mora imati barem 6 znakova.';return}
 S={name:v('ime'),mail:v('mail'),age:+v('dob'),h:+v('vis'),w:+v('tez'),goal:v('cilj'),lvl:v('lvl'),pref:v('gdje'),days:{},sync:null,hist:[]};
 loc=S.pref;
 // povijest zadnjih 6 dana (demo)
 for(let i=6;i>=1;i--){const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10);S.days[d]={steps:rnd(3500,11000),stress:rnd(25,75),log:[],kcal:rnd(0,300)}}
 save();render();
}
function skip(){
 S={name:'Gošća',mail:'demo@fitza.app',age:30,h:168,w:65,goal:'Jačanje i tonus',lvl:'Početnica',pref:'Kod kuće',days:{},sync:null,hist:[],demo:true,onb:0};
 loc=S.pref;
 for(let i=6;i>=1;i--){const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10);S.days[d]={steps:rnd(3500,11000),stress:rnd(25,75),log:[],kcal:rnd(0,300)}}
 sync('Mobitel');
}
function sync(src){
 const d=day();
 d.steps=Math.min(d.steps+rnd(1800,3600),25000);
 d.stress=rnd(22,78);
 S.sync={src,t:new Date().toLocaleTimeString('hr',{hour:'2-digit',minute:'2-digit'}),hr:rnd(62,84)};
 save();notify('Sinkronizirano: '+src);
}
function home(){
 const d=day(),g=goalSteps(),pct=Math.min(100,Math.round(d.steps/g*100));
 const st=d.stress, stTxt=st==null?'—':st<35?'Nizak 😌':st<60?'Umjeren 🙂':'Visok 😟';
 const hist=Object.keys(S.days).sort().slice(-7);
 const mx=Math.max(...hist.map(k=>S.days[k].steps),1);
 return `<div class="hero"><div class="avatar">🌸</div><h1>Bok, ${S.name}!</h1><p>${MOTIV[new Date().getDate()%MOTIV.length]}</p></div>
 <div class="pad">
 <div class="card" style="text-align:center"><div class="ring" style="background:conic-gradient(var(--p) ${pct*3.6}deg,var(--line) 0)"><div><b>${d.steps.toLocaleString('hr')}</b><span class="mut">od ${g.toLocaleString('hr')} koraka</span></div></div>
  <p class="mut">${pct}% dnevnog cilja</p></div>
 <div class="grid">
  <div class="stat"><span class="mut">Razina stresa</span><b>${st==null?'—':st+'/100'}</b><span class="mut">${stTxt}</span></div>
  <div class="stat"><span class="mut">Potrošeno (trening)</span><b>${d.kcal} kcal</b><span class="mut">${d.log.length} treninga danas</span></div>
  <div class="stat"><span class="mut">Puls u mirovanju</span><b>${S.sync?S.sync.hr+' bpm':'—'}</b><span class="mut">${S.sync?S.sync.src+' · '+S.sync.t:'nije sinkronizirano'}</span></div>
  <div class="stat"><span class="mut">Voda (cilj)</span><b>${waterGoal()} L</b><span class="mut">KMI ${bmi()}</span></div>
 </div>
 <div class="card" style="margin-top:12px"><h3>Sinkronizacija uređaja</h3><p class="mut" style="margin:4px 0 10px">Povuci korake, puls i stres s mobitela ili pametnog sata (demo simulacija).</p>
  <div class="row"><button class="btn sec sm" onclick="sync('Mobitel')">📱 Mobitel</button><button class="btn sec sm" onclick="sync('Pametni sat')">⌚ Sat</button></div></div>
 <div class="card"><h3>Koraci – zadnjih 7 dana</h3><div class="spark">${hist.map(k=>`<i style="height:${Math.max(6,S.days[k].steps/mx*100)}%" title="${k}"></i>`).join('')}</div></div>
 ${d.stress>=60?`<div class="card" style="background:#fff9db"><b>Visok stres.</b> Probaj 20 min joge za opuštanje.<button class="btn sm" style="margin-top:8px" onclick="tab='train';loc='Kod kuće';openWo='h3';render()">Otvori trening</button></div>`:''}
 <div class="card"><h3>Danas na tanjuru</h3><p class="mut" style="margin:4px 0 8px">Preporuka: ${RECIPES[new Date().getDate()%RECIPES.length].n}</p><button class="btn sec sm" onclick="tab='food';openRec='${RECIPES[new Date().getDate()%RECIPES.length].id}';render()">Pogledaj recept</button></div>
 </div>`;
}
function find(id){for(const k in WORKOUTS){const w=WORKOUTS[k].find(x=>x.id===id);if(w)return w}}
let tInt=null,tSec=0;
function startTimer(){clearInterval(tInt);tInt=setInterval(()=>{tSec++;const t=$('#tm');if(t)t.textContent=fmt(tSec)},1000)}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function finish(id){
 clearInterval(tInt);const w=find(id),d=day();
 d.log.push({id,n:w.n,t:fmt(tSec)});d.kcal+=w.kcal;d.steps+=Math.round(w.min*70);
 tSec=0;openWo=null;save();notify('Trening spremljen! 🎉');
}
function train(){
 if(openWo){const w=find(openWo);
  return `<div class="pad"><button class="btn sec sm" onclick="clearInterval(tInt);tSec=0;openWo=null;render()">← Natrag</button>
  <h2 style="margin-top:12px">${w.n}</h2><span class="tag">${w.lvl}</span><span class="tag g">${w.min} min</span><span class="tag g">~${w.kcal} kcal</span>
  <div class="card" style="margin-top:12px"><h3>Vježbe</h3><p class="mut">Dodirni vježbu za tehniku izvođenja.</p><ol>${w.ex.map(e=>`<li><details><summary style="cursor:pointer"><b>${e}</b></summary><p class="mut" style="margin:6px 0 4px;color:#4a4255">${tech(e)}</p></details></li>`).join('')}</ol></div>
  <div class="card"><h3>Savjeti za ovaj trening</h3><div style="margin-top:8px">${(WB[w.id]||[]).map(i=>`<span class="chip" style="display:inline-block;margin:0 6px 6px 0" onclick="goTips(${i})">${Object.keys(TIPS)[i]}</span>`).join('')}</div></div>
  <div class="timer" id="tm">${fmt(tSec)}</div>
  <div class="row"><button class="btn sec" onclick="startTimer()">▶ Start</button><button class="btn" onclick="finish('${w.id}')">✔ Završi</button></div></div>`}
 const d=day();
 const sw=`<div class="chips"><div class="chip ${tsub==='wo'?'on':''}" onclick="tsub='wo';render()">Treninzi</div><div class="chip ${tsub==='tips'?'on':''}" onclick="tsub='tips';render()">Savjeti po tijelu</div></div>`;
 if(tsub==='tips')return `<div class="pad"><h2>Savjeti za vježbanje</h2>${sw}
 <div class="chips">${Object.keys(TIPS).map(k=>`<div class="chip ${k===tipCat?'on':''}" onclick="tipCat='${k}';render()">${k}</div>`).join('')}</div>
 <div class="card"><h3>${tipCat}</h3><ul>${TIPS[tipCat].map(t=>`<li>${t}</li>`).join('')}</ul></div></div>`;
 return `<div class="pad"><h2>Treninzi</h2>${sw}
 <div class="chips">${Object.keys(WORKOUTS).map(k=>`<div class="chip ${k===loc?'on':''}" onclick="loc='${k}';render()">${{'Kod kuće':'🏠','U teretani':'🏋️','Na otvorenom':'🌳'}[k]} ${k}</div>`).join('')}</div>
 ${WORKOUTS[loc].map(w=>`<div class="card sub" onclick="openWo='${w.id}';render()"><h3>${w.n}</h3><div style="margin-top:6px"><span class="tag">${w.lvl}</span><span class="tag g">${w.min} min</span><span class="tag g">~${w.kcal} kcal</span></div></div>`).join('')}
 ${d.log.length?`<h3 style="margin:14px 0 8px">Danas odrađeno</h3>${d.log.map(l=>`<div class="card">✅ ${l.n} <span class="mut">· ${l.t}</span></div>`).join('')}`:''}</div>`;
}
let scale=1;
function food(){
 if(openRec){const r=RECIPES.find(x=>x.id===openRec),f=scale;
  const fx=n=>{const v=n*f;return Number.isInteger(v)?v:v.toFixed(1).replace('.',',')};
  return `<div class="pad"><button class="btn sec sm" onclick="openRec=null;scale=1;render()">← Recepti</button>
  <h2 style="margin-top:12px">${r.n}</h2><span class="tag">${r.cat}</span><span class="tag g">${r.min} min</span>
  <div class="grid" style="margin:12px 0"><div class="stat"><b>${Math.round(r.kcal*f)}</b><span class="mut">kcal</span></div><div class="stat"><b>${Math.round(r.p*f)} g</b><span class="mut">bjelančevine</span></div></div>
  <div class="card"><div class="row" style="align-items:center"><h3>Sastojci</h3><div style="text-align:right"><button class="btn sec sm" onclick="scale=Math.max(1,scale-1);render()">−</button> <b>${f} ${f===1?'porcija':'por.'}</b> <button class="btn sec sm" onclick="scale=Math.min(6,scale+1);render()">+</button></div></div>
  <ul>${r.ing.map(i=>`<li><b>${fx(i[1])} ${i[2]}</b> ${i[0]}</li>`).join('')}</ul></div>
  <div class="card"><h3>Priprema</h3><ol>${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div>
  <div class="card" style="background:#e6fcf5"><b>💡 Savjet:</b> ${r.tip}</div></div>`}
 const cats=['Sve','Doručak','Ručak','Večera','Međuobrok'];
 return `<div class="pad"><h2>Recepti 🥗</h2>
 <div class="chips">${cats.map(c=>`<div class="chip ${c===rcat?'on':''}" onclick="rcat='${c}';render()">${c}</div>`).join('')}</div>
 ${RECIPES.filter(r=>rcat==='Sve'||r.cat===rcat).map(r=>`<div class="card sub" onclick="openRec='${r.id}';scale=1;render()"><h3>${r.n}</h3><div style="margin-top:6px"><span class="tag">${r.cat}</span><span class="tag g">${r.min} min</span><span class="tag g">${r.kcal} kcal</span><span class="tag g">${r.p} g bjel.</span></div></div>`).join('')}</div>`;
}
const FREQ={daily:['Svaki dan',[0,1,2,3,4,5,6],1.55],every2:['Svaki drugi dan',[0,2,4,6],1.45],every3:['Svaki treći dan',[0,3,6],1.375],twice:['2× tjedno',[1,4],1.3]};
const DAYS=['Ponedjeljak','Utorak','Srijeda','Četvrtak','Petak','Subota','Nedjelja'];
function target(f){
 const bmr=10*S.w+6.25*S.h-5*S.age-161;let k=bmr*FREQ[f][2];
 if(S.goal==='Gubitak kilograma')k-=400;else if(S.goal==='Jačanje i tonus')k+=150;
 return Math.round(k/50)*50;
}
function mk(cat,i){const l=RECIPES.filter(r=>r.cat===cat);return l[i%l.length]}
function plan(){
 if(!S.plan)S.plan={f:'every2',p:S.pref};
 const f=S.plan.f,p=S.plan.p,tr=FREQ[f][1],pool=WORKOUTS[p];let wi=0,tot=0;
 const rows=DAYS.map((dn,i)=>{
  const t=tr.includes(i);let w=null;if(t){w=pool[wi%pool.length];wi++}
  const meals=[['🌅 Doručak',mk('Doručak',i)],['☀️ Ručak',mk('Ručak',i)],['🍎 Međuobrok',t?RECIPES.find(r=>r.id==='r7'):RECIPES.find(r=>r.id==='r8')],['🌙 Večera',mk('Večera',i)]];
  const kc=meals.reduce((a,m)=>a+m[1].kcal,0);
  return `<details class="card" ${i===0?'open':''}><summary style="cursor:pointer;display:flex;justify-content:space-between"><b>${dn}</b><span class="tag ${t?'':'g'}">${t?'💪 Trening':'😴 Odmor'}</span></summary>
  <div style="margin-top:10px">${t?`<div class="card sub" style="background:var(--p2);margin-bottom:8px" onclick="loc='${p}';openWo='${w.id}';tab='train';tsub='wo';render()"><b>${w.n}</b><br><span class="mut">${w.min} min · ~${w.kcal} kcal – dodirni za početak</span></div>`:`<p class="mut" style="margin-bottom:8px">Aktivni odmor: 20–30 min laganog hoda i 10 min istezanja.</p>`}
  ${meals.map(m=>`<div class="sub" style="padding:6px 0;border-top:1px solid var(--line)" onclick="tab='food';openRec='${m[1].id}';scale=1;render()"><span class="mut">${m[0]}</span><br><b style="font-size:14px">${m[1].n}</b> <span class="mut">· ${m[1].kcal} kcal</span></div>`).join('')}
  <p class="mut" style="margin-top:6px">Ukupno recepti: ${kc} kcal</p></div></details>`}).join('');
 return `<div class="pad"><h2>Tjedni plan 📅</h2>
 <label style="margin-top:0">Koliko često želiš vježbati?</label>
 <div class="chips">${Object.keys(FREQ).map(k=>`<div class="chip ${k===f?'on':''}" onclick="S.plan.f='${k}';save();render()">${FREQ[k][0]}</div>`).join('')}</div>
 <label style="margin-top:0">Gdje?</label>
 <div class="chips">${Object.keys(WORKOUTS).map(k=>`<div class="chip ${k===p?'on':''}" onclick="S.plan.p='${k}';save();render()">${k}</div>`).join('')}</div>
 <div class="grid" style="margin:4px 0 12px"><div class="stat"><b>${tr.length}</b><span class="mut">treninga tjedno</span></div><div class="stat"><b>~${target(f)}</b><span class="mut">kcal dnevno (cilj: ${S.goal})</span></div></div>
 <p class="mut" style="margin-bottom:10px">Plan se računa iz tvojih podataka. Recepti čine glavninu dana – dopuni porcijama povrća, voća i vodom (${waterGoal()} L). Procjena je okvirna.</p>
 ${rows}</div>`;
}
function profile(){
 return `<div class="pad"><h2>Profil</h2>
 <div class="card"><h3>${S.name}</h3><p class="mut">${S.demo?'Demo način – registracija preskočena':S.mail}</p>${S.demo?`<button class="btn sm" style="margin-top:10px" onclick="S=null;render()">Registriraj se</button>`:''}</div>
 <div class="grid"><div class="stat"><span class="mut">Dob</span><b>${S.age}</b></div><div class="stat"><span class="mut">Visina</span><b>${S.h} cm</b></div>
 <div class="stat"><span class="mut">Težina</span><b>${S.w} kg</b></div><div class="stat"><span class="mut">KMI</span><b>${bmi()}</b></div></div>
 <div class="card" style="margin-top:12px"><span class="mut">Cilj</span><br><b>${S.goal}</b><br><span class="mut" style="display:block;margin-top:8px">Razina / omiljeno mjesto</span><b>${S.lvl} · ${S.pref}</b></div>
 <div class="card"><h3>Povezani uređaji</h3><p class="mut">Mobitel (Apple Zdravlje / Google Fit) i pametni sat – u punoj verziji aplikacije, ovdje simulacija.</p></div>
 <button class="btn sec" onclick="if(window.__c){S=null;mem={};store.set('fitza',null);tab='home';render()}else{window.__c=1;notify('Dodirni opet za odjavu i brisanje')}">Odjava i brisanje podataka</button></div>`;
}
function render(){
 const el=$('#app');
 if(!S){el.innerHTML=auth()+(toast?`<div class="toast">${toast}</div>`:'');return}
 const body={home,plan,train,food,profile}[tab]();
 const nav=[['home','🏠','Početna'],['plan','📅','Plan'],['train','💪','Trening'],['food','🥗','Recepti'],['profile','👤','Profil']];
 el.innerHTML=body+`<nav>${nav.map(n=>`<button class="${tab===n[0]?'on':''}" onclick="tab='${n[0]}';openRec=null;openWo=null;window.__c=0;render();scrollTo(0,0)"><span>${n[1]}</span>${n[2]}</button>`).join('')}</nav>`+(toast?`<div class="toast">${toast}</div>`:'');
}
render();
</script>
</body>
</html>
